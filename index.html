<title>Mustika Gamers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: kanvas 3D layar penuh; kartu login, panel menu di kanan (bawah di ponsel), HUD melayang di atas kanvas. */
:root{--bg:#0b0a14;--panel:#15132a;--panel2:#1f1c3d;--ink:#efeaff;--muted:#a29bc6;--jade:#3ee0a1;--ember:#ff8a3d;--blood:#ff4d6d;--gold:#ffd36b;--line:#34305f;--display:'Bungee',Impact,sans-serif;--body:'Nunito',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.screen>*{pointer-events:auto}
#login{align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0b0a1480,#0b0a14ee)}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;box-shadow:0 20px 60px #000a}
.logo{font:400 clamp(34px,9vw,48px)/.95 var(--display);color:var(--ink);letter-spacing:.02em}
.logo b{color:var(--jade);font-weight:400}
.sub{color:var(--muted);margin:12px 0 20px}
label,.lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=password],select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 16px var(--body)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.btn{cursor:pointer;border:0;border-radius:10px;padding:13px 18px;font:400 16px var(--display);letter-spacing:.04em;background:var(--jade);color:#04170f;width:100%;margin-top:18px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.err{color:var(--blood);font-weight:700;margin:10px 0 0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#menu{justify-content:flex-end;align-items:stretch}
.panel{width:min(460px,100%);max-height:100%;overflow:auto;background:#15132af2;border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;touch-action:pan-y}
.panel h2{font:400 22px var(--display);margin:0 0 2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;flex:1;text-align:center;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
.seg input:checked+label{border-color:var(--jade);background:#143a30;color:var(--jade)}
.seg input:focus-visible+label{outline:2px solid var(--jade)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 13px var(--body)}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #fff4}
.chip.on{border-color:var(--ember);background:#3a2214;color:var(--gold)}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gcard{cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:10px 11px;font:inherit}
.gcard b{display:block;font:400 14px var(--display);letter-spacing:.02em}
.gcard span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.gcard.on{border-color:var(--jade);background:#12332b}
.gcard .e{font-size:22px;float:right;margin-left:6px}
#online{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:6;font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;background:#0b0a14cc;border:1px solid var(--line);color:var(--jade)}
#online.off{color:var(--muted)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
#hud>*{pointer-events:auto}
#hudTop{position:absolute;top:calc(48px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px;align-items:flex-start;pointer-events:none}
.pill{background:#0b0a14d9;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;min-width:0}
.pill small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#goal{flex:1;max-width:420px}
#stats{text-align:right;font:400 18px var(--display);white-space:nowrap}
#hearts{color:var(--blood);letter-spacing:.1em}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:9;background:#0b0a14ee;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:12px;font:400 16px var(--display);pointer-events:none;text-align:center;max-width:90vw}
#flash{position:fixed;inset:0;background:radial-gradient(ellipse at center,#ff1a3a00 40%,#ff1a3acc);opacity:0;pointer-events:none;z-index:5;transition:opacity .35s}
#bar{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(48px + env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:8px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#0b0a14d9;color:var(--ink);font-size:20px;cursor:pointer}
.ib.on{border-color:var(--jade);background:#12332b}
#chat{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(300px,52vw)}
#log{max-height:110px;overflow:hidden;display:flex;flex-direction:column;gap:3px;font-size:13px;margin-bottom:6px;pointer-events:none}
#log div{background:#0b0a14b8;padding:3px 8px;border-radius:8px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
#log b{color:var(--jade)}
#chatForm{display:flex;gap:6px}
#chatForm input{padding:9px 11px;font-size:14px}
#chatForm button{border:0;border-radius:10px;background:var(--panel2);color:var(--ink);padding:0 12px;font-size:18px;cursor:pointer}
#emo{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
#emoTabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
#emoTabs button,#emoGrid button{background:none;border:0;font-size:22px;cursor:pointer;border-radius:8px;padding:3px 5px}
#emoTabs button.on{background:var(--panel2)}
#emoGrid{display:flex;flex-wrap:wrap;max-height:150px;overflow-y:auto}
#joy{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff33;touch-action:none;display:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffff55}
#act{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:88px;height:88px;border-radius:50%;border:2px solid var(--gold);background:#3a2214e6;color:var(--gold);font:400 13px var(--display);cursor:pointer;display:none;line-height:1.1}
#pip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(48px + env(safe-area-inset-top,0px) + 70px);width:104px;height:78px;object-fit:cover;border-radius:10px;border:2px solid var(--jade);transform:scaleX(-1);margin-right:56px;background:#000}
#rv{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:calc(150px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:4;pointer-events:none}
.rv{width:104px;height:78px;object-fit:cover;border-radius:10px;border:2px solid var(--ember);background:#000}
#end{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:#0b0a14cc;padding:16px}
#end .card{text-align:center}
#end h2{font:400 30px var(--display);margin:0 0 8px}
#msg{position:fixed;inset:auto 16px 16px;z-index:20;text-align:center;color:var(--blood);font-weight:800}
@media(max-width:700px){#menu{align-items:flex-end}.panel{max-height:64%}#goal{max-width:none}}
@media (pointer:coarse){#joy{display:block}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>

</div>
<div id="rv"></div>
<div id="flash"></div>

 };
 const mtof=m=>440*Math.pow(2,(m-69)/12);
 function init(){

  const comp=ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
  const len=Math.floor(ac.sampleRate*2.2), ib=ac.createBuffer(2,len,ac.sampleRate);

  const osc=ac.createOscillator(),g=ac.createGain(); osc.type=type; osc.frequency.value=mtof(m); if(o.det)osc.detune.value=o.det;

function updateOnlineChip(){

function netConnect(token){
 return new Promise(res=>{
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+encodeURIComponent(token));
  let myId=null;const peersL=[],chatL=[],sigL=[];let opened=false;
  const send=o=>{if(ws.readyState===1)ws.send(JSON.stringify(o))};
  const api={presence:p=>{send({t:'presence',p});return Promise.resolve()},emit:(t,data)=>{send({t,data});return Promise.resolve()},
   onPeers:f=>peersL.push(f),on:(t,f)=>chatL.push(f),sig:(to,data)=>send({t:'sig',to,data}),onSig:f=>sigL.push(f),get id(){return myId}};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
   if(m.t==='hello'){myId=m.id;opened=true;res(api)}
   else if(m.t==='peers'){const peers=m.peers.map(p=>({peer:p.id,isMe:p.id===myId,presence:p.p}));peersL.forEach(f=>f({peers}))}
   else if(m.t==='chat')chatL.forEach(f=>f({sameTab:false,data:m.data}));
   else if(m.t==='sig')sigL.forEach(f=>f(m))};
  ws.onerror=()=>{if(!opened)res(null)};
  ws.onclose=()=>{if(!opened){res(null);return}online=null;peersSnap=[];rtcSync();updateOnlineChip();toast('Koneksi ke server terputus',2500)};
 });
}
async function connectRoom(token){

 online.onPeers(ch=>{peersSnap=ch.peers;updateOnlineChip();rtcSync()});
 online.on('chat',m=>{const d=m.data||{};if(typeof d.t!=='string'||d.m!==(G&&G.id))return;addChat(str(d.n)||'Pemain',d.t.slice(0,80))});

/* ---- WebRTC: kamera dan suara antar pemain dalam game yang sama (mesh) ---- */
const pcs=new Map();
function rtcPeers(){return G?peersSnap.filter(p=>!p.isMe&&p.presence&&p.presence.mode===G.id).map(p=>p.peer):[]}
function rtcSync(){const want=new Set(rtcPeers());want.forEach(id=>{if(!pcs.has(id))rtcOpen(id)});[...pcs.keys()].forEach(id=>{if(!want.has(id))rtcClose(id)})}
function rtcClose(id){const e=pcs.get(id);if(!e)return;try{e.pc.close()}catch(x){}if(e.audio)e.audio.remove();if(e.video)e.video.remove();pcs.delete(id)}
function rtcOpen(id){
 if(!online)return;const pc=new RTCPeerConnection(ICE_CFG),e={pc,polite:Number(online.id)>Number(id),making:false,ignore:false};pcs.set(id,e);
 pc.onicecandidate=ev=>{if(ev.candidate)online.sig(id,{c:ev.candidate})};
 pc.onnegotiationneeded=async()=>{try{e.making=true;await pc.setLocalDescription();online.sig(id,{d:pc.localDescription})}catch(x){}finally{e.making=false}};
 pc.ontrack=ev=>{const st=ev.streams[0];if(!st)return;
  if(ev.track.kind==='audio'){if(!e.audio){e.audio=document.createElement('audio');e.audio.autoplay=true;document.body.append(e.audio)}e.audio.srcObject=st}
  else{if(!e.video){const v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.className='rv';$('#rv').append(v);e.video=v}e.video.srcObject=st;e.video.hidden=false;
   ev.track.onmute=()=>{if(e.video)e.video.hidden=true};ev.track.onunmute=()=>{if(e.video)e.video.hidden=false}}};
 [camStream,micStream].forEach(s=>{if(s)s.getTracks().forEach(t=>pc.addTrack(t,s))});
}
async function rtcSignal(m){

 const pc=e.pc,d=m.data||{};
 try{
  if(d.d){const collide=d.d.type==='offer'&&(e.making||pc.signalingState!=='stable');e.ignore=!e.polite&&collide;if(e.ignore)return;
   await pc.setRemoteDescription(d.d);if(d.d.type==='offer'){await pc.setLocalDescription();online.sig(m.from,{d:pc.localDescription})}}
  else if(d.c){try{await pc.addIceCandidate(d.c)}catch(x){if(!e.ignore)throw x}}
 }catch(x){}
}
function rtcRemove(st){pcs.forEach(e=>e.pc.getSenders().forEach(snd=>{if(snd.track&&st.getTracks().includes(snd.track)){try{e.pc.removeTrack(snd)}catch(x){}}}))}
function addChat(n,t){const l=$('#log');const d=document.createElement('div');const b=document.createElement('b');b.textContent=n+': ';d.append(b,document.createTextNode(t));l.append(d);while(l.children.length>6)l.firstChild.remove()}

/* ================= UI ================= */
function buildMenuUI(){
 $('#kl').innerHTML=KELAS.map(k=>'<option>'+k+'</option>').join('');
 const chip=c=>'<button type="button" class="chip" data-c="'+c.id+'"><i style="background:'+hex(c.top)+'"></i>'+c.name+'</button>';
 $('#cH').innerHTML=COSTUMES.filter(c=>c.grp==='H').map(chip).join('');
 $('#cA').innerHTML=COSTUMES.filter(c=>c.grp==='A').map(chip).join('');
 $('#games').innerHTML=Object.entries(MODES).map(([id,m])=>'<button type="button" class="gcard" data-g="'+id+'"><span class="e">'+m.e+'</span><b>'+m.name+'</b><span>'+m.d+'</span></button>').join('');
 const mark=()=>{document.querySelectorAll('.chip').forEach(e=>e.classList.toggle('on',e.dataset.c===me.c));document.querySelectorAll('.gcard').forEach(e=>e.classList.toggle('on',e.dataset.g===selMode))};
 document.querySelectorAll('.chip').forEach(e=>e.onclick=()=>{me.c=e.dataset.c;mark();setMenuAvatar()});
 document.querySelectorAll('.gcard').forEach(e=>e.onclick=()=>{selMode=e.dataset.g;mark();Music.set(MODES[selMode].music)});
 $('#kl').onchange=()=>{me.kelas=$('#kl').value;setMenuAvatar()};
 $('#nm').oninput=()=>{me.name=$('#nm').value.trim();};
 $('#nm').onchange=()=>setMenuAvatar();
 document.querySelectorAll('input[name=gd]').forEach(e=>e.onchange=()=>{me.g=e.value;setMenuAvatar()});
 mark();
 $('#play').onclick=()=>{
  me.name=$('#nm').value.trim();if(!me.name){$('#nm').focus();toast('Isi nama dulu ya',1400);return}
  me.kelas=$('#kl').value;Music.start();startGame(selMode);
 };
}
function buildEmoji(){
 const tabs=$('#emoTabs'),grid=$('#emoGrid');
 function show(k){tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));grid.innerHTML='';EMOJI[k].split(' ').forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e;b.onclick=()=>sendEmoji(e);grid.append(b)})}
 Object.keys(EMOJI).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=k;b.dataset.k=k;b.onclick=()=>show(k);tabs.append(b)});
 show('😀');
}
function sendEmoji(e){
 if(!G)return;G.av.userData.setEmoji(e,3500);$('#emo').hidden=true;
 if(online)online.presence({e,et:Date.now()}).catch(()=>{});
}
let camStream=null,micStream=null;
async function media(kind){
 const btn=kind==='video'?$('#bCam'):$('#bMic'),cur=kind==='video'?camStream:micStream;
 if(cur){rtcRemove(cur);cur.getTracks().forEach(t=>t.stop());if(kind==='video'){camStream=null;$('#pip').hidden=true}else micStream=null;btn.classList.remove('on');return}
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
  const st=await navigator.mediaDevices.getUserMedia(kind==='video'?{video:{width:320,height:240,facingMode:'user'}}:{audio:{echoCancellation:true,noiseSuppression:true}});
  if(kind==='video'){camStream=st;$('#pip').srcObject=st;$('#pip').hidden=false}else micStream=st;
  pcs.forEach(e=>st.getTracks().forEach(t=>e.pc.addTrack(t,st)));
  btn.classList.add('on');toast((kind==='video'?'Kamera':'Mikrofon')+' aktif',1500);
 }catch(e){toast((kind==='video'?'Kamera':'Mikrofon')+' tidak bisa diakses. Periksa izin browser dan pastikan situs memakai HTTPS.',2800)}
}
function bindControls(){
 $('#bEmo').onclick=()=>{$('#emo').hidden=!$('#emo').hidden};
 $('#bCam').onclick=()=>media('video');$('#bMic').onclick=()=>media('audio');
 $('#bMus').onclick=()=>{Music.mute(!Music.muted);$('#bMus').textContent=Music.muted?'🔇':'🔊'};
 $('#bExit').onclick=exitToMenu;
 $('#again').onclick=()=>startGame(G?G.id:selMode);
 $('#toMenu').onclick=exitToMenu;
 $('#chatForm').onsubmit=e=>{e.preventDefault();const i=$('#chatIn'),t=i.value.trim();if(!t||!G)return;i.value='';addChat(me.name,t);if(online)online.emit('chat',{n:me.name,t,m:G.id}).catch(()=>{})};
 $('#chatIn').onkeydown=e=>e.stopPropagation();
 $('#chatIn').onkeyup=e=>e.stopPropagation();
 const act=$('#act');act.onpointerdown=e=>{e.preventDefault();if(G&&G.action)G.action()};
 addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();keys[k]=true;if((k===' '||k==='f'||(k==='e'&&G&&G.action))&&G&&G.action){e.preventDefault();G.action()}});
 addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
 // putar kamera: seret di kanvas
 const cv=$('#gl');let drag=null;
 cv.addEventListener('pointerdown',e=>{drag=e.clientX});
 addEventListener('pointerup',()=>drag=null);
 addEventListener('pointermove',e=>{if(drag!==null&&screen==='game'&&(e.pointerType==='mouse'?e.buttons&1:e.target===cv)){camS.yaw-=(e.clientX-drag)*.006;drag=e.clientX}});
 // joystik
 const joy=$('#joy'),knob=joy.firstElementChild;let jid=null;
 const jm=e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}input.x=dx;input.y=-dy;knob.style.transform='translate('+dx*35+'px,'+dy*35+'px)'};
 joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});
 joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
 const je=e=>{if(e.pointerId===jid){jid=null;input.x=input.y=0;knob.style.transform=''}};
 joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);
}
async function login(e){
 e.preventDefault();const btn=$('#loginForm button');btn.disabled=true;let ok=false,msg='Kata sandi salah. Coba lagi.';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
  const j=await r.json();
  if(j.ok){if(j.ice)ICE_CFG={iceServers:j.ice};ok=await connectRoom(j.token);if(!ok)msg='Tidak bisa tersambung ke server permainan.'}else msg=j.error||msg;
 }catch(x){msg='Server tidak terjangkau.'}
 btn.disabled=false;
 if(ok){Music.start();Music.set('horror');$('#login').hidden=true;$('#menu').hidden=false;screen='menu';setMenuAvatar();pushPresence(true)}
 else{const err=$('#loginErr');err.textContent=msg;err.hidden=false;const c=$('#login .card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');$('#pw').select()}
}
addEventListener('pointerdown',()=>{Music.start();Music.set('horror')},{once:true});

/* ================= BOOT ================= */
if(typeof THREE!=='undefined'&&renderer){
 buildMenu();buildMenuUI();buildEmoji();bindControls();
 menuAv=null;me.name='Pemain';setMenuAvatar();me.name='';
 $('#loginForm').addEventListener('submit',login);
 loop();
}else{const m=$('#msg');m.hidden=false;m.textContent='Gagal memuat mesin 3D. Periksa koneksi internet lalu muat ulang.'}
</script>
